<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="25" font-weight="600" fill="#1a1a1a">Toplam Yanıt Süresi Kararlılığı — Varyasyon Katsayısı (CV %)</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#666">Düşük CV = daha tutarlı/öngörülebilir gecikme (std ÷ ortalama)</text>

  <!-- Y axis grid 0,10,20,30,40 ; baseline y=500, top y=100 (val 0..45) -->
  <line x1="120" y1="500" x2="950" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="120" y1="100" x2="120" y2="500" stroke="#333" stroke-width="1.5"/>
  <g font-size="13" fill="#666">
    <line x1="120" y1="500" x2="950" y2="500" stroke="#eee"/><text x="108" y="505" text-anchor="end">0</text>
    <line x1="120" y1="411" x2="950" y2="411" stroke="#eee"/><text x="108" y="416" text-anchor="end">10</text>
    <line x1="120" y1="322" x2="950" y2="322" stroke="#eee"/><text x="108" y="327" text-anchor="end">20</text>
    <line x1="120" y1="233" x2="950" y2="233" stroke="#eee"/><text x="108" y="238" text-anchor="end">30</text>
    <line x1="120" y1="144" x2="950" y2="144" stroke="#eee"/><text x="108" y="149" text-anchor="end">40</text>
  </g>
  <text x="40" y="300" text-anchor="middle" font-size="15" fill="#444" transform="rotate(-90 40 300)">CV (%)</text>

  <!-- bars: gpt-oss 15.3, Gemma 7.1, Qwen 39.2, GLM 10.8 ; h=(v/45)*400 -->
  <rect x="164" y="364" width="120" height="136" fill="#2ca02c"/>
  <text x="224" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#333">15,3</text>
  <text x="224" y="525" text-anchor="middle" font-size="15" fill="#333">gpt-oss-120b</text>

  <rect x="371" y="437" width="120" height="63" fill="#2ca02c"/>
  <text x="431" y="425" text-anchor="middle" font-size="17" font-weight="700" fill="#333">7,1</text>
  <text x="431" y="525" text-anchor="middle" font-size="15" fill="#333">Gemma4:e2b</text>

  <rect x="578" y="152" width="120" height="348" fill="#d62728"/>
  <text x="638" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#333">39,2</text>
  <text x="638" y="525" text-anchor="middle" font-size="15" fill="#333">Qwen 2.5 7B</text>

  <rect x="785" y="404" width="120" height="96" fill="#2ca02c"/>
  <text x="845" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#333">10,8</text>
  <text x="845" y="525" text-anchor="middle" font-size="15" fill="#333">GLM-5.1</text>

  <text x="500" y="565" text-anchor="middle" font-size="13" fill="#888">Qwen yerel kaynak çekişmesine en duyarlı modeldir (std 19,2 sn; aykırı koşumlar 87–113 sn).</text>
</svg>
