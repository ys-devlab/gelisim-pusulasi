<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-size="25" font-weight="600" fill="#1a1a1a">Tekrar Kararlılığı — 45 Koşumda Benzersiz Rapor Sayısı</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#666">temperature=0, seed=42; her çalışan 3 tekrar. Düşük sayı = daha deterministik çıktı</text>

  <line x1="120" y1="500" x2="950" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="120" y1="100" x2="120" y2="500" stroke="#333" stroke-width="1.5"/>
  <g font-size="13" fill="#666">
    <line x1="120" y1="500" x2="950" y2="500" stroke="#eee"/><text x="108" y="505" text-anchor="end">0</text>
    <line x1="120" y1="411" x2="950" y2="411" stroke="#eee"/><text x="108" y="416" text-anchor="end">15</text>
    <line x1="120" y1="322" x2="950" y2="322" stroke="#eee"/><text x="108" y="327" text-anchor="end">30</text>
    <line x1="120" y1="233" x2="950" y2="233" stroke="#eee"/><text x="108" y="238" text-anchor="end">45</text>
  </g>
  <text x="40" y="300" text-anchor="middle" font-size="15" fill="#444" transform="rotate(-90 40 300)">Benzersiz rapor (/45)</text>

  <!-- scale: y=500-(v/45)*267 ; gpt-oss 45, Gemma 30, Qwen 30, GLM 45 -->
  <rect x="164" y="233" width="120" height="267" fill="#1f77b4"/>
  <text x="224" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#333">45 / 45</text>
  <text x="224" y="525" text-anchor="middle" font-size="15" fill="#333">gpt-oss-120b</text>

  <rect x="371" y="322" width="120" height="178" fill="#1f77b4"/>
  <text x="431" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#333">30 / 45</text>
  <text x="431" y="525" text-anchor="middle" font-size="15" fill="#333">Gemma4:e2b</text>

  <rect x="578" y="322" width="120" height="178" fill="#1f77b4"/>
  <text x="638" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#333">30 / 45</text>
  <text x="638" y="525" text-anchor="middle" font-size="15" fill="#333">Qwen 2.5 7B</text>

  <rect x="785" y="233" width="120" height="267" fill="#1f77b4"/>
  <text x="845" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#333">45 / 45</text>
  <text x="845" y="525" text-anchor="middle" font-size="15" fill="#333">GLM-5.1</text>

  <text x="500" y="565" text-anchor="middle" font-size="13" fill="#888">Yerel modeller (Ollama, greedy) tekrar başına ~2 benzersiz metin; bulut reasoning modelleri her koşumda farklı.</text>
</svg>
